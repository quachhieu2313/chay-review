{% extends "base.html" %}

{% block title %}Đăng nhập - Ăn Chay Ở Đâu{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-3">Đăng nhập</h2>
        <form method="post" class="card p-4">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">Tên đăng nhập hoặc mật khẩu không đúng.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                {{ form.password }}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-success" type="submit">Đăng nhập</button>
            <p class="mt-3 mb-0">Chưa có tài khoản? <a href="{% url 'accounts:register' %}">Đăng ký ngay</a></p>
        </form>
    </div>
</div>
{% endblock %}
