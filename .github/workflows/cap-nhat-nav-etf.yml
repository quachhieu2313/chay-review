# NAV, chênh lệch giá/NAV và tín hiệu "Điểm mua" cho các quỹ ETF của Dragon Capital (E1VFVN30, FUEVFVND, FUEDCMID).
# Dragon Capital đăng NAV trong ngày khoảng 17h20–18h nên chạy lúc 19h30, sau lượt cập nhật chính (16h40).
# Trong lúc chờ, trang tự so giá với iNAV đọc trực tiếp từ API của Dragon Capital.
# Chạy tay: tab Actions -> "Cập nhật NAV quỹ ETF" -> Run workflow.
name: Cập nhật NAV quỹ ETF

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 19:30 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cài thư viện
        run: pip install -r scripts/requirements.txt

      - name: Lấy NAV từ Dragon Capital
        run: python scripts/etf_nav.py

      - name: Lưu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/etf_nav
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới."
          else
            git commit -m "Cập nhật NAV quỹ ETF $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              echo "Đẩy lên chưa được, thử lại lần $i"; sleep 5
            done
          fi
