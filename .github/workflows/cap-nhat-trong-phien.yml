# Cập nhật nhanh trong giờ giao dịch: chỉ lấy bảng giá hiện tại (~30 giây/lần).
# Không chạy dày hơn: GitHub Pages chỉ build lại web khoảng 10 lần mỗi giờ.
name: Cập nhật giá trong phiên

on:
  # Không dùng lịch "schedule" của GitHub: thực tế bị trễ hàng giờ hoặc bỏ qua.
  # Lịch 10 phút/lần do cron-job.org gọi API workflow_dispatch (xem HUONG_DAN.md).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cài thư viện
        run: pip install -r scripts/requirements.txt

      - name: Lấy bảng giá
        run: python scripts/cap_nhat_du_lieu.py --trong-phien

      - name: Lưu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          if git diff --cached --quiet; then
            echo "Giá không đổi, không cần cập nhật."
          else
            git commit -m "Cập nhật giá trong phiên $(TZ=Asia/Ho_Chi_Minh date +%H:%M\ %d/%m/%Y)"
            # nếu có lượt chạy khác vừa đẩy lên: ghép lại, ưu tiên dữ liệu của lượt này (mới hơn), thử tối đa 3 lần
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              echo "Đẩy lên chưa được, thử lại lần $i"; sleep 5
            done
          fi
