# Cập nhật nhanh trong giờ giao dịch: chỉ lấy bảng giá hiện tại (~30 giây/lần).
# Lịch theo giờ UTC (giờ Việt Nam trừ 7): 9:00-14:50 mỗi 10 phút, thêm 15:00 và 15:10.
# GitHub có thể chạy trễ vài phút so với lịch khi hệ thống đông.
# Không chạy dày hơn: GitHub Pages chỉ build lại web khoảng 10 lần mỗi giờ.
name: Cập nhật giá trong phiên

on:
  schedule:
    - cron: "*/10 2-7 * * 1-5"
    - cron: "0,10 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cài thư viện
        run: pip install -r scripts/requirements.txt

      - name: Lấy bảng giá
        run: python scripts/cap_nhat_du_lieu.py --trong-phien

      - name: Lưu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          if git diff --cached --quiet; then
            echo "Giá không đổi, không cần cập nhật."
          else
            git commit -m "Cập nhật giá trong phiên $(TZ=Asia/Ho_Chi_Minh date +%H:%M\ %d/%m/%Y)"
            git pull --rebase
            git push
          fi
