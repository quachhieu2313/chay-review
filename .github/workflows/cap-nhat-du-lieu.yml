# Chạy đầy đủ mỗi chiều ngày giao dịch: tải lại toàn bộ lịch sử, tính lại chỉ số rủi ro, chốt giá đóng cửa.
# Chạy tay: vào tab Actions trên GitHub -> "Cập nhật dữ liệu thị trường" -> Run workflow.
name: Cập nhật dữ liệu thị trường

on:
  schedule:
    - cron: "37 9 * * 1-5"   # dự phòng 16:37 (GitHub hay chạy trễ); lịch chính do cron-job.org gọi lúc 16:40
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # đăng cảnh báo dòng tiền quỹ thành Issue để GitHub báo về email/điện thoại

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cài thư viện
        run: pip install -r scripts/requirements.txt

      - name: Lấy dữ liệu
        run: python scripts/cap_nhat_du_lieu.py

      - name: Lưu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data ban-tin
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới."
          else
            git commit -m "Cập nhật dữ liệu thị trường $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
            # nếu có lượt chạy khác vừa đẩy lên: ghép lại, ưu tiên dữ liệu của lượt này (mới hơn), thử tối đa 3 lần
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              echo "Đẩy lên chưa được, thử lại lần $i"; sleep 5
            done
          fi

      - name: Gửi cảnh báo
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/gui_canh_bao.py
