# Tự động lấy dữ liệu thị trường mới mỗi tối ngày giao dịch rồi đẩy lên web.
# Chạy tay: vào tab Actions trên GitHub -> "Cập nhật dữ liệu thị trường" -> Run workflow.
name: Cập nhật dữ liệu thị trường

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 16:30 giờ Việt Nam, thứ Hai đến thứ Sáu
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cài thư viện
        run: pip install -r scripts/requirements.txt

      - name: Lấy dữ liệu
        run: python scripts/cap_nhat_du_lieu.py

      - name: Lưu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới."
          else
            git commit -m "Cập nhật dữ liệu thị trường $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
            git push
          fi
