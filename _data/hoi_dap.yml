# Câu hỏi thường gặp (trang Hỏi đáp).
# Thêm câu mới: copy 2 dòng "- hoi / dap" rồi sửa nội dung. Giữ đúng thụt lề 2 dấu cách.
# Nội dung có dấu hai chấm ":" thì bọc cả câu trong ngoặc kép.
- hoi: Kim Chỉ Nam có phải công ty quản lý quỹ không?
  dap: Không. Kim Chỉ Nam là trang thông tin và công cụ miễn phí, không quản lý tiền, không nhận tiền đầu tư và không bán chứng chỉ quỹ. Muốn mua ETF, bạn giao dịch qua tài khoản chứng khoán tại công ty chứng khoán của mình.

- hoi: Số liệu trên trang lấy từ đâu, có chính xác không?
  dap: Giá cổ phiếu, ETF và chỉ số được lấy từ bảng giá công khai của Vietcap (VCI), chỉ số tài chính từ KBS, tự động cập nhật khoảng 10 phút một lần trong giờ giao dịch và chốt lại sau 16:40. Đây không phải dữ liệu thời gian thực. Dữ liệu có thể chậm hoặc sai sót, vì vậy hãy đối chiếu với nguồn chính thức trước khi ra quyết định.

- hoi: Vì sao lợi nhuận ETF ở đây khác với số công ty quản lý quỹ công bố?
  dap: Trang này tính theo giá giao dịch trên sàn, trong khi công ty quản lý quỹ thường công bố theo NAV. Giá thị trường có thể cao hơn hoặc thấp hơn NAV, và cách tính phần lợi nhuận đã phân phối cũng có thể khác.

- hoi: Mục tiêu cá nhân của tôi được lưu ở đâu?
  dap: Ngay trên trình duyệt bạn đang dùng. Trang không có máy chủ thu thập dữ liệu, nên không ai khác xem được. Nếu bạn xoá dữ liệu duyệt web hoặc dùng máy khác thì danh sách sẽ không đi theo.

- hoi: Nội dung trên trang có phải khuyến nghị đầu tư không?
  dap: Không. Bài viết và công cụ chỉ nhằm mục đích giáo dục và tham khảo. Hãy tự tìm hiểu kỹ hoặc hỏi ý kiến chuyên gia tư vấn được cấp phép trước khi đầu tư.
