# Câu hỏi thường gặp (trang Hỏi đáp).
# Thêm câu mới: copy 2 dòng "- hoi / dap" rồi sửa nội dung. Giữ đúng thụt lề 2 dấu cách.
- hoi: Kim Chỉ Nam có mất phí không?
  dap: Không. Tất cả công cụ trên trang này đều miễn phí và không cần tạo tài khoản.

- hoi: Mục tiêu của tôi được lưu ở đâu?
  dap: Ngay trên trình duyệt bạn đang dùng (bộ nhớ cục bộ). Trang không có máy chủ thu thập dữ liệu, nên không ai khác xem được. Đổi lại, nếu bạn xoá dữ liệu duyệt web hoặc dùng máy khác thì danh sách sẽ không đi theo.

- hoi: Chuỗi "ngày liên tiếp" được tính thế nào?
  dap: Mỗi ngày bạn hoàn thành ít nhất một mục tiêu được tính là một ngày giữ kỷ luật. Bỏ trống một ngày thì chuỗi bắt đầu lại từ đầu, vì vậy hãy đặt mục tiêu nhỏ để dễ giữ nhịp.

- hoi: Số liệu chứng khoán trên trang có phải giá thật không?
  dap: Chưa. Phần thị trường hiện dùng dữ liệu minh hoạ để giới thiệu giao diện. Đừng dùng các con số này để ra quyết định mua bán.

- hoi: Nội dung trên trang có phải khuyến nghị đầu tư không?
  dap: Không. Bài viết và công cụ chỉ nhằm mục đích giáo dục và tham khảo. Hãy tự tìm hiểu kỹ hoặc hỏi ý kiến chuyên gia tư vấn được cấp phép trước khi đầu tư.
